        transferCount:
          type: integer
          minimum: 0
          description: 过户次数（手数）
        displacementL:
          type: [number, "null"]
          exclusiveMinimum: 0
          description: 排量（升）。不适用时显式 null 可清空。
        energyConsumption:
          type: [number, "null"]
          exclusiveMinimum: 0
          description: 电耗。不适用时显式 null 可清空。
        batteryKwh:
          type: [number, "null"]
          exclusiveMinimum: 0
          description: 电池度数（kWh）。不适用时显式 null 可清空。
        vin:
          type: [string, "null"]
          description: 车架号。显式 null 表示清空。

