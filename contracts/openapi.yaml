# first release，not breaking。
# contracts/ 此前为空，本次全部新增。内部方法见 internal.yaml，错误码见 errors.yaml。
openapi: 3.1.0
info:
  title: 车辆信息展示系统 HTTP 契约
  version: 1.2.0
  summary: F-001 / F-003 / F-004 首次落约
  description: |
    **first release，not breaking。** `contracts/` 此前为空，本次全部为新增。

    覆盖已裁决 feature：F-001 车辆信息管理、F-003 图片与评估报告、F-004 价格记录。
    不覆盖仍为 draft 的 F-002（前台页面结构与展示文案）、F-005（回收站）、F-006（登录与账号）。

    ## 鉴权
    `/admin/*` 均声明 `security: [adminAuth: []]`。鉴权由 F-006 定稿，本期假设已登录管理员。
    本文件不规定登录方式、token 形态与刷新。未携带有效管理员凭据时返回 401 UNAUTHORIZED。
    `/public/*` 无登录。前台无用户体系。

    ## 错误
    所有错误响应体：
    `{ "code": "VEHICLE_NOT_FOUND", "message": "...", "details": {} }`
    码表与 HTTP 映射见 `errors.yaml`。公开端对不存在或未上架车辆一律 404 VEHICLE_NOT_FOUND，禁止 403。

    ## 内部方法（不是 HTTP）
    F-001 发布反查不得走本文件 paths：
    - `countImages(vehicleId) -> int`（F-003）
    - `isPriceFilled(vehicleId) -> boolean`（F-004）
    详见 `internal.yaml`。

    ## 字段与范围
    JSON 字段 camelCase。车辆资源不含价格。公开响应不得出现 vin / vinMasked。
    不做：导出、批量改价、回收站、登录注册、软删除字段、前台文案「面议」。

    ## 图片确认策略
    预签名后，确认落库为一次一张（`adminConfirmVehicleImage` / `adminConfirmVehicleReport`），
    由客户端循环。不使用 HTTP 207。部分失败由客户端按单张结果处理。
    同一 objectKey 重复确认返回已落库资源（200），不创建第二条。

servers:
  - url: http://localhost:8080
    description: 本地开发。路径无额外前缀，`/admin` 与 `/public` 位于服务根。
  - url: https://{host}
    description: 部署环境占位。前台域名备案是部署前置条件（ADR-011），host 本期不写死。
    variables:
      host:
        default: api.example.invalid
        description: 服务端主机名，上线时替换

tags:
  - name: admin-vehicles
    description: F-001 车辆信息管理（管理端）
  - name: public-vehicles
    description: F-001 车辆信息管理（公开端）。服务端硬过滤仅 published，不接受客户端传 status。
  - name: admin-images
    description: F-003 车辆图片（管理端）
  - name: admin-reports
    description: F-003 评估报告（管理端）
  - name: public-media
    description: F-003 图片与评估报告（公开端）。仅 published 车辆；下架不失效已生成直链，但本接口不再返回。
  - name: admin-prices
    description: F-004 价格记录（管理端）
  - name: public-prices
    description: F-004 价格（公开端）。只返回类型 + 金额，无操作人；文案「面议」由 F-002 决定。

security: []

paths:
  /admin/vehicles:
    post:
      tags: [admin-vehicles]
      operationId: adminCreateVehicle
      summary: 创建草稿车辆
      description: |
        创建 status=draft 的车辆。车辆 id 为系统生成的 int64 技术主键，version 从 1 起。
        请求头 Idempotency-Key 必填；同一 Key 重放返回同一资源（首次 201，重放 200）。
        同一 Key 搭配不同请求体 → 409 IDEMPOTENCY_KEY_CONFLICT。仅 2xx 占用该 Key，4xx 可用同一 Key 更正后重试。
        body 可带 initialPrice（PriceValue）。若提供，须在同一事务内写入第一条价格记录（F-004）；
        车辆资源本身不含价格字段。initialPrice 校验失败则整单失败，不创建车辆。
      security:
        - adminAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminVehicleCreateRequest"
            examples:
              gasoline:
                summary: 汽油车草稿，带初始一口价
                value:
                  brand: 大众
                  model: 帕萨特
                  registrationYear: 2020
                  mileageKm: 35000
                  color: 白色
                  conditionDesc: 车况良好，定期保养
                  energyType: gasoline
                  transferCount: 1
                  displacementL: 1.8
                  vin: LSVAM24H3BN123456
                  initialPrice:
                    type: amount
                    amount: 128000.00
              evNegotiable:
                summary: 纯电，初始面谈
                value:
                  brand: 特斯拉
                  model: Model 3
                  registrationYear: 2022
                  mileageKm: 12000
                  color: 黑色
                  conditionDesc: 无重大事故
                  energyType: ev
                  transferCount: 0
                  energyConsumption: 13.2
                  batteryKwh: 60
                  initialPrice:
                    type: negotiable
                    amount: null
      responses:
        "201":
          description: 首次创建成功
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Location:
              description: 新资源路径，如 `/admin/vehicles/1`
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminVehicle"
        "200":
          description: 幂等重放，返回首次创建的同一资源
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminVehicle"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

    get:
      tags: [admin-vehicles]
      operationId: adminListVehicles
      summary: 管理端车辆列表
      description: |
        支持按 status 筛选、按 q 关键字搜索品牌与车型（包含匹配，大小写不敏感）。
        分页按可增长规模设计，禁止假设车辆总数不超过 100。
        默认按 id 降序。列表项不含价格。
      security:
        - adminAuth: []
      parameters:
        - name: status
          in: query
          required: false
          description: 按车辆状态精确筛选。省略则不过滤状态。
          schema:
            $ref: "#/components/schemas/VehicleStatus"
        - name: q
          in: query
          required: false
          description: 关键字，搜索品牌、车型。空字符串视为未传。不搜 VIN、颜色或其它字段。
          schema:
            type: string
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 分页列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminVehicleList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/vehicles/{id}:
    get:
      tags: [admin-vehicles]
      operationId: adminGetVehicle
      summary: 管理端车辆详情
      description: |
        返回核心字段 + vinMasked（只露后六位）。不返回 vin 明文，不返回价格。
        ETag 为当前 version，供后续 PATCH 使用。
      security:
        - adminAuth: []
      parameters:
        - $ref: "#/components/parameters/VehicleId"
      responses:
        "200":
          description: 车辆详情
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminVehicle"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/VehicleNotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    patch:
      tags: [admin-vehicles]
      operationId: adminPatchVehicle
      summary: 编辑车辆核心字段
      description: |
        只改核心字段（含 vin），不改 status。编辑与状态转换解耦（ADR-004）。
        乐观锁：必须提供 If-Match 或 body.version 之一；两者都提供时必须表示同一 version。
        不一致 → 409 VEHICLE_VERSION_CONFLICT，message 固定为「该车辆已被修改，请刷新后重试」。
        两者都缺 → 400 MISSING_VERSION。
        省略的字段保持不变；可选字段显式 null 表示清空。
        energyType 变更导致某选填字段不再适用时，服务端将该字段置 null；
        若客户端在不适用时传非 null，400 VALIDATION_ERROR。
        F-005：车辆在回收站中（trashedAt 不为空）时一律拒绝，返回 409
        VEHICLE_IN_RECYCLE_BIN（本响应见下方 409 Conflict）；检查顺序为先查回收站态，
        再查版本冲突，最先短路。
      security:
        - adminAuth: []
      parameters:
        - $ref: "#/components/parameters/VehicleId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminVehiclePatchRequest"
      responses:
        "200":
          description: 更新后的车辆
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminVehicle"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/VehicleNotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/vehicles/{id}/publish:
    post:
      tags: [admin-vehicles]
      operationId: adminPublishVehicle
      summary: 发布 / 重新上架
      description: |
        将草稿或已下架车辆变为 published。
        已 published 时重复调用：200，无副作用，version 不变。
        发布前置（ADR-003）：进程内调用 countImages ≥ 4 且 isPriceFilled === true。
        任一不满足 → 422 PUBLISH_PRECONDITION_FAILED，details.missing 列出 images 与/或 price，
        并给出 imageCount、priceFilled。
        反查抛错 → 500 INTERNAL_ERROR，禁止当成未满足前置。
        本动作合法来源只有 draft 与 unpublished（以及 published 幂等），无非法转换 409。
        F-005：车辆在回收站中（trashedAt 不为空）时一律拒绝，返回 409 VEHICLE_IN_RECYCLE_BIN，
        检查顺序为先查回收站态，最先短路（此时不判断发布前置条件）。
      security:
        - adminAuth: []
      parameters:
        - $ref: "#/components/parameters/VehicleId"
      responses:
        "200":
          description: 已上架（含目标态幂等）
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminVehicle"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/VehicleNotFound"
        "409":
          description: 车辆在回收站中（VEHICLE_IN_RECYCLE_BIN，F-005）
          content:
            application/json:
              schema:
                $ref: "./errors.yaml#/components/schemas/ErrorResponse"
              example:
                code: VEHICLE_IN_RECYCLE_BIN
                message: 该车辆在回收站中，无法编辑
                details: {}
        "422":
          description: 不满足发布前置条件
          content:
            application/json:
              schema:
                $ref: "./errors.yaml#/components/schemas/ErrorResponse"
              examples:
                missingBoth:
                  value:
                    code: PUBLISH_PRECONDITION_FAILED
                    message: 不满足发布前置条件
                    details:
                      missing: [images, price]
                      imageCount: 2
                      priceFilled: false
                missingImages:
                  value:
                    code: PUBLISH_PRECONDITION_FAILED
                    message: 不满足发布前置条件
                    details:
                      missing: [images]
                      imageCount: 3
                      priceFilled: true
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/vehicles/{id}/unpublish:
    post:
      tags: [admin-vehicles]
      operationId: adminUnpublishVehicle
      summary: 下架
      description: |
        仅 published → unpublished。
        已 unpublished 时重复调用：200，无副作用。
        对草稿调用：409 ILLEGAL_STATUS_TRANSITION，details.from=draft，details.action=unpublish。
        下架后 /public/* 立即不可见。图片/报告/价格不做联动处理，已生成直链不失效。
        F-005：车辆在回收站中（trashedAt 不为空）时一律拒绝，返回 409 VEHICLE_IN_RECYCLE_BIN；
        检查顺序为先查回收站态（最先短路），再查状态转换合法性。
      security:
        - adminAuth: []
      parameters:
        - $ref: "#/components/parameters/VehicleId"
      responses:
        "200":
          description: 已下架（含目标态幂等）
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminVehicle"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/VehicleNotFound"
        "409":
          description: |
            非法状态转换（ILLEGAL_STATUS_TRANSITION，对草稿下架），或车辆在回收站中
            （VEHICLE_IN_RECYCLE_BIN，F-005）
          content:
            application/json:
              schema:
                $ref: "./errors.yaml#/components/schemas/ErrorResponse"
              examples:
                illegalTransition:
                  value:
                    code: ILLEGAL_STATUS_TRANSITION
                    message: 非法的车辆状态转换
                    details:
                      from: draft
                      action: unpublish
                inRecycleBin:
                  value:
                    code: VEHICLE_IN_RECYCLE_BIN
                    message: 该车辆在回收站中，无法编辑
                    details: {}
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/vehicles/{id}/trash:
    post:
      tags: [admin-vehicles]
      operationId: adminTrashVehicle
      summary: 删除到回收站
      description: |
        源状态 draft / unpublished / published 均可直接删除，无需先下架。
        已上架车辆删除时，服务端额外写一条「下架」操作日志（ADR-023）。

        检查顺序（先后如下，前面命中即短路，不做后面的检查）：
        1. 车辆不存在 → 404 VEHICLE_NOT_FOUND
        2. 已彻底清除（purged=true）→ 404 RECYCLE_BIN_ITEM_PURGED
        3. 已在回收站（trashedAt 已有值，未清除）→ 200 幂等成功，不刷新 trashedAt，
           不做版本比对（幂等短路优先于乐观锁校验，即使客户端带的 version 已过期也返回成功）
        4. 以上均不命中（车辆在管）→ 校验乐观锁（If-Match 或 body.version 二选一必填，
           不一致 409 VEHICLE_VERSION_CONFLICT），通过后执行删除

        操作人、时间写入操作日志（ADR-025）。
      security: [{ adminAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/VehicleId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                version: { type: integer, format: int64, minimum: 1 }
      responses:
        "200": { description: 已在回收站中（含幂等重复调用）, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/AdminVehicle' } } } }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { description: 车辆不存在（VEHICLE_NOT_FOUND），或已被彻底清除（RECYCLE_BIN_ITEM_PURGED）, content: { application/json: { schema: { $ref: './errors.yaml#/components/schemas/ErrorResponse' } } } }
        "409": { $ref: '#/components/responses/Conflict' }
        "500": { $ref: '#/components/responses/InternalError' }

  /admin/vehicles/{id}/restore:
    post:
      tags: [admin-vehicles]
      operationId: adminRestoreVehicle
      summary: 从回收站恢复
      description: |
        恢复一律落 draft（ADR-023），不保留删除前原状态。
        乐观锁：与 trash 对称，If-Match 或 body.version 二选一必填。

        检查顺序（先后如下，前面命中即短路）：
        1. 车辆不存在 → 404 VEHICLE_NOT_FOUND
        2. 已彻底清除（purged=true）→ 404 RECYCLE_BIN_ITEM_PURGED
        3. 从未进入回收站（trashedAt 一直为空，即正常在管车辆）→
           409 VEHICLE_NOT_IN_RECYCLE_BIN（不当幂等成功，避免掩盖前端误调用）
        4. 已在回收站且未清除（trashedAt 有值）→ 校验乐观锁（不一致 409
           VEHICLE_VERSION_CONFLICT），通过后恢复为 draft，trashedAt 置空
        5. 已恢复后短时间内重复调用同一 restore（trashedAt 已被自己刚置空）→
           200 幂等成功，不比对 version（与 trash 幂等短路对称）

        恢复优先于尚未跑完的到期清除任务（ADR-024）：只要记录未被清除任务标记 purged，
        恢复即成功；该竞态由服务端事务/行锁保证原子性，客户端无需感知中间态。
        操作人、时间写入操作日志（ADR-025）。
      security: [{ adminAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/VehicleId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                version: { type: integer, format: int64, minimum: 1 }
      responses:
        "200": { description: 已恢复为草稿（含幂等重复调用）, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/AdminVehicle' } } } }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { description: 车辆不存在（VEHICLE_NOT_FOUND），或已被彻底清除（RECYCLE_BIN_ITEM_PURGED）, content: { application/json: { schema: { $ref: './errors.yaml#/components/schemas/ErrorResponse' } } } }
        "409": { description: 版本冲突（VEHICLE_VERSION_CONFLICT），或车辆本不在回收站中（VEHICLE_NOT_IN_RECYCLE_BIN）, content: { application/json: { schema: { $ref: './errors.yaml#/components/schemas/ErrorResponse' } } } }
        "500": { $ref: '#/components/responses/InternalError' }

  /admin/recycle-bin:
    get:
      tags: [admin-vehicles]
      operationId: adminListRecycleBin
      summary: 回收站列表
      description: |
        仅列出 trashedAt 不为空且 purged=false 的车辆。排序：trashedAt 倒序，
        并列时按 id 倒序（二级排序键，保证同一秒内批量删除多台车时分页结果稳定，不重复不遗漏）。
        支持关键字搜索（品牌+车型，规则与 GET /public/vehicles 的 keyword 一致：服务端 trim +
        不区分大小写模糊匹配；trim 后为空字符串等价于未传，返回全量）与分页。
        keyword 无匹配结果：total 0，items 空数组，不报错。
        page 超出筛选后总数范围：返回 items 空数组，不报错（与 GET /public/vehicles 一致）。
        每项额外返回 originalStatus（删除前状态）、trashedAt、purgeDueAt（到期日，服务端计算，
        = trashedAt 时间戳 **严格 + 720 小时**，不做自然月/日历对齐，Asia/Shanghai 展示时区）。
        多次「删除→恢复→再删除」循环后，purgeDueAt 基于最新一次 trashedAt 重新计算（ADR-023）。
      security: [{ adminAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: keyword
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 50 }
          description: 模糊匹配品牌+车型，规则同 GET /public/vehicles 的 keyword。
      responses:
        "200":
          description: |
            回收站列表。不返回整体 ETag header——每个 item 自带 version 字段
            （见 AdminRecycleBinItem），前端据此调用 restore（作为 body.version 或拼 If-Match）。
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminRecycleBinList' } } }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "500": { $ref: '#/components/responses/InternalError' }

  /admin/recycle-bin/{id}:
    get:
      tags: [admin-vehicles]
      operationId: adminGetRecycleBinItem
      summary: 回收站内车辆详情（只读）
      description: |
        仅 trashedAt 不为空（在站或已清除）可访问；不在回收站中（含从未删除、已恢复）→ 404
        VEHICLE_NOT_FOUND。
        返回车辆核心字段只读视图（不可编辑），purged 字段标明是否已彻底清除，version 字段
        供前端调用 restore 时拼 If-Match。
        **不含价格字段**——价格走既有 `GET /admin/vehicles/{id}/price-records`
        （已放宽为对回收站/已清除车辆同样可访问），避免两套价格查询口径不一致。
        图片/评估报告复用现有只读接口（GET /admin/vehicles/{id}/images、/reports），
        本 RFC 放宽这两个接口对已删除/已清除车辆的可访问性（见下方"影响面"）。
        **已彻底清除（purged=true）车辆**：images/reports 记录仍原样返回（服务端不做二次过滤），
        但对应对象存储文件大概率已被异步删除，直链可能已失效，**前端需自行处理图片/文件加载失败**，
        不代表服务端异常。
      security: [{ adminAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/VehicleId'
      responses:
        "200":
          description: 回收站内车辆只读详情（headers 无 ETag，version 已在响应体里）
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminRecycleBinItem' } } }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/VehicleNotFound' }
        "500": { $ref: '#/components/responses/InternalError' }

  /public/vehicles:
    get:
      tags: [public-vehicles]
      operationId: publicListVehicles
      summary: 公开车辆列表
      description: |
        仅返回 published。服务端硬过滤，不接受客户端传 status。
        不含 vin / vinMasked / 图片；列表项含 coverImageUrl 与 currentPrice（聚合字段，见
        PublicVehicleSummary）。分页按可增长规模设计。
        默认按 id 降序，不受筛选影响。

        keyword / priceMin / priceMax / registrationYearMin / registrationYearMax /
        mileageKmMin / mileageKmMax 均为可选参数，可任意组合，组合语义为 AND；不传即当前行为
        （全量已上架列表）。

        分页越界（筛选后命中总数 < (page-1)×pageSize）返回 items: []，total 为筛选后匹配总数，
        不报错。无匹配结果：total 为 0，items 为空数组，page/pageSize 原样返回。

        区间参数下限 > 上限（priceMin>priceMax / registrationYearMin>registrationYearMax /
        mileageKmMin>mileageKmMax）：400 VALIDATION_ERROR。
      security: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: keyword
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 50
          description: |
            模糊匹配品牌+车型，服务端 trim 后按不区分大小写匹配；trim 后为空字符串等价于未传。
        - name: priceMin
          in: query
          required: false
          schema:
            type: number
            exclusiveMinimum: 0
            multipleOf: 0.01
          description: |
            当前价下限（人民币元）。使用价格区间筛选（priceMin/priceMax 任一存在）时面谈车
            （amount=null）一律不进结果集。服务端按分为单位（乘 100 取整）比较，不依赖 schema
            multipleOf 的浮点判定。priceMin > priceMax 返回 400 VALIDATION_ERROR。
        - name: priceMax
          in: query
          required: false
          schema:
            type: number
            exclusiveMinimum: 0
            multipleOf: 0.01
          description: 当前价上限，规则同 priceMin。
        - name: registrationYearMin
          in: query
          required: false
          schema:
            type: integer
            minimum: 1980
            maximum: 2100
          description: |
            上牌年份下限；registrationYearMin > registrationYearMax 返回 400 VALIDATION_ERROR。
        - name: registrationYearMax
          in: query
          required: false
          schema:
            type: integer
            minimum: 1980
            maximum: 2100
          description: 上牌年份上限，规则同 registrationYearMin。
        - name: mileageKmMin
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
          description: |
            里程下限（千米）；mileageKmMin > mileageKmMax 返回 400 VALIDATION_ERROR。
        - name: mileageKmMax
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
          description: 里程上限，规则同 mileageKmMin。
      responses:
        "200":
          description: 已上架车辆分页列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicVehicleList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /public/vehicles/{id}:
    get:
      tags: [public-vehicles]
      operationId: publicGetVehicle
      summary: 公开车辆详情
      description: |
        仅 published 可访问。不存在或非 published 一律 404 VEHICLE_NOT_FOUND，禁止 403。
        响应不得出现 vin / vinMasked。不含价格。
      security: []
      parameters:
        - $ref: "#/components/parameters/VehicleId"
      responses:
        "200":
          description: 已上架车辆
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicVehicle"
        "404":
          $ref: "#/components/responses/VehicleNotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/vehicles/{id}/images/presign:
    post:
      tags: [admin-images]
      operationId: adminPresignVehicleImage
      summary: 申请图片直传预签名 URL
      description: |
        车辆必须已存在（含草稿）。服务端只签发上传凭证，不落图片元数据。
        客户端将文件直传到 uploadUrl，再调用 adminConfirmVehicleImage。
        图片：jpg/png/webp，对应 Content-Type image/jpeg、image/png、image/webp；单张 ≤ 10 MiB（10485760 字节）。
        F-005：车辆在回收站中（trashedAt 不为空）时一律拒绝，返回 409 VEHICLE_IN_RECYCLE_BIN。
      security:
        - adminAuth: []
      parameters:
        - $ref: "#/components/parameters/VehicleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImagePresignRequest"
      responses:
        "200":
          description: 预签名成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresignResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/VehicleNotFound"
        "409":
          description: 车辆在回收站中（VEHICLE_IN_RECYCLE_BIN，F-005）
          content:
            application/json:
              schema:
                $ref: "./errors.yaml#/components/schemas/ErrorResponse"
              example:
                code: VEHICLE_IN_RECYCLE_BIN
                message: 该车辆在回收站中，无法编辑
                details: {}
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/vehicles/{id}/images:
    post:
      tags: [admin-images]
      operationId: adminConfirmVehicleImage
      summary: 确认图片落库
      description: |
        一次确认一张。客户端循环实现批量；不使用 207。
        服务端确认 objectKey 属于该车的预签名且对象已出现在存储中，再写元数据。
        caption 可省略，默认空字符串。1:1 图片说明，允许空字符串。
        同一 objectKey 重复确认：200，返回已落库的同一图片，不创建第二条。
        单车图片超过 100 张只告警不阻断（ADR-009）。
        图片无独立 status，保存后立即生效。
        F-005：车辆在回收站中（trashedAt 不为空）时一律拒绝，返回 409 VEHICLE_IN_RECYCLE_BIN。
      security:
        - adminAuth: []
      parameters:
        - $ref: "#/components/parameters/VehicleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmImageRequest"
      responses:
        "201":
          description: 首次确认落库
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminVehicleImage"
        "200":
          description: 同一 objectKey 重复确认，返回已有图片
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminVehicleImage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/VehicleNotFound"
        "409":
          description: 车辆在回收站中（VEHICLE_IN_RECYCLE_BIN，F-005）
          content:
            application/json:
              schema:
                $ref: "./errors.yaml#/components/schemas/ErrorResponse"
              example:
                code: VEHICLE_IN_RECYCLE_BIN
                message: 该车辆在回收站中，无法编辑
                details: {}
        "500":
          $ref: "#/components/responses/InternalError"

    get:
      tags: [admin-images]
      operationId: adminListVehicleImages
      summary: 管理端列出车辆图片
      description: 按当前排序返回该车全部图片（无独立分页）。车辆不存在 404。
      security:
        - adminAuth: []
      parameters:
        - $ref: "#/components/parameters/VehicleId"
      responses:
        "200":
          description: 图片列表（当前顺序）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminVehicleImageList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/VehicleNotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/vehicles/{id}/images/order:
    put:
      tags: [admin-images]
      operationId: adminReorderVehicleImages
      summary: 一次性提交图片全排列顺序
      description: |
        imageIds 必须是该车当前全部图片 id 的一个排列：不可多、不可少、不可重复。
        事务更新。不做逐张上移，不做并发排序冲突检测（后写覆盖可接受）。
        路径中的 `order` 是字面量，实现路由时须排在 `{imageId}` 之前。
        F-005：车辆在回收站中（trashedAt 不为空）时一律拒绝，返回 409 VEHICLE_IN_RECYCLE_BIN。
      security:
        - adminAuth: []
      parameters:
        - $ref: "#/components/parameters/VehicleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderImagesRequest"
      responses:
        "200":
          description: 更新后的完整列表（新顺序）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminVehicleImageList"
        "400":
          description: IMAGE_ORDER_MISMATCH 或 VALIDATION_ERROR
          content:
            application/json:
              schema:
                $ref: "./errors.yaml#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/VehicleNotFound"
        "409":
          description: 车辆在回收站中（VEHICLE_IN_RECYCLE_BIN，F-005）
          content:
            application/json:
              schema:
                $ref: "./errors.yaml#/components/schemas/ErrorResponse"
              example:
                code: VEHICLE_IN_RECYCLE_BIN
                message: 该车辆在回收站中，无法编辑
                details: {}
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/vehicles/{id}/images/{imageId}:
    patch:
      tags: [admin-images]
      operationId: adminPatchVehicleImageCaption
      summary: 只改图片说明
      description: 只能改 caption。不允许改 url、objectKey、顺序。caption 允许空字符串。
      security:
        - adminAuth: []
      parameters:
        - $ref: "#/components/parameters/VehicleId"
        - $ref: "#/components/parameters/ImageId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchImageCaptionRequest"
      responses:
        "200":
          description: 更新后的图片
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminVehicleImage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: 车辆或图片不存在
          content:
            application/json:
              schema:
                $ref: "./errors.yaml#/components/schemas/ErrorResponse"
              examples:
                vehicle:
                  value:
                    code: VEHICLE_NOT_FOUND
                    message: 车辆不存在
                    details: {}
                image:
                  value:
                    code: IMAGE_NOT_FOUND
                    message: 图片不存在
                    details: {}
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags: [admin-images]
      operationId: adminDeleteVehicleImage
      summary: 删除图片
      description: |
        物理删除元数据与对象存储文件，不做软删除、不保留历史版本。
        替换 = 新增 + 删除，无原地覆盖。
        已上架车辆删除后数量将 < 4 → 409 PUBLISHED_IMAGE_MIN，不得删成 3 张。
        二次确认由管理后台 UI 负责，本接口无确认参数。
        F-005：车辆在回收站中（trashedAt 不为空）时一律拒绝，返回 409 VEHICLE_IN_RECYCLE_BIN；
        检查顺序为先查回收站态（最先短路），再查 PUBLISHED_IMAGE_MIN。
      security:
        - adminAuth: []
      parameters:
        - $ref: "#/components/parameters/VehicleId"
        - $ref: "#/components/parameters/ImageId"
      responses:
        "204":
          description: 已删除
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: 车辆或图片不存在
          content:
            application/json:
              schema:
                $ref: "./errors.yaml#/components/schemas/ErrorResponse"
        "409":
          description: |
            已上架车辆图片不得少于 4 张（PUBLISHED_IMAGE_MIN），或车辆在回收站中
            （VEHICLE_IN_RECYCLE_BIN，F-005）
          content:
            application/json:
              schema:
                $ref: "./errors.yaml#/components/schemas/ErrorResponse"
              examples:
                publishedImageMin:
                  value:
                    code: PUBLISHED_IMAGE_MIN
                    message: 已上架车辆至少保留 4 张图片，请先下架或先补充图片
                    details: {}
                inRecycleBin:
                  value:
                    code: VEHICLE_IN_RECYCLE_BIN
                    message: 该车辆在回收站中，无法编辑
                    details: {}
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/vehicles/{id}/reports/presign:
    post:
