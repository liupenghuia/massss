          description: 首次确认落库
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminVehicleReport"
        "200":
          description: 同一 objectKey 重复确认
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminVehicleReport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/VehicleNotFound"
        "409":
          description: 车辆在回收站中（VEHICLE_IN_RECYCLE_BIN，F-005）
          content:
            application/json:
              schema:
                $ref: "./errors.yaml#/components/schemas/ErrorResponse"
              example:
                code: VEHICLE_IN_RECYCLE_BIN
                message: 该车辆在回收站中，无法编辑
