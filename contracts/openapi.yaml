                 displacementL, energyConsumption, batteryKwh, vinMasked, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          description: 系统生成的技术主键，跨 feature 关联锚点
        version:
          type: integer
          format: int64
          minimum: 1
          description: 乐观锁版本号，调用 restore 时作为 body.version 或拼 If-Match 使用
        originalStatus:
          type: string
          enum: [draft, published, unpublished]
          description: 删除前的状态（ADR-025 展示字段）
        trashedAt:
          type: string
          format: date-time
          description: 删除进站时间
        purgeDueAt:
          type: string
          format: date-time
          description: |
            到期彻底清除时间，服务端计算 = trashedAt 严格 + 720 小时（不做日历对齐），Asia/Shanghai
            展示时区。purged=true 时本字段仅表示历史到期时间，不代表任何未来动作，不用于倒计时展示。
        purged:
          type: boolean
          description: 是否已彻底清除。已清除时本资源仅剩只读展示用途，无法恢复。
        brand:
          type: [string, "null"]
          description: 品牌。草稿阶段未填写时为 null（ADR-035）。
        model:
          type: [string, "null"]
          description: 车型。草稿阶段未填写时为 null（ADR-035）。
        registrationYear:
          type: [integer, "null"]
          description: 上牌年份（公元纪年）。草稿阶段未填写时为 null（ADR-035）。
        mileageKm:
          type: [integer, "null"]
          minimum: 0
          description: 里程（千米）。草稿阶段未填写时为 null（ADR-035）。
        color:
          type: [string, "null"]
          description: 颜色。草稿阶段未填写时为 null（ADR-035）。
        conditionDesc:
          type: [string, "null"]
          description: 车况描述。草稿阶段未填写时为 null（ADR-035）。
        energyType:
