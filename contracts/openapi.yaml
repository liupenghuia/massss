                    message: 车辆不存在
                    details: {}
                report:
                  value:
                    code: REPORT_NOT_FOUND
                    message: 评估报告不存在
                    details: {}
        "409":
          description: 车辆在回收站中（VEHICLE_IN_RECYCLE_BIN，F-005）
          content:
            application/json:
              schema:
                $ref: "./errors.yaml#/components/schemas/ErrorResponse"
              example:
                code: VEHICLE_IN_RECYCLE_BIN
                message: 该车辆在回收站中，无法编辑
                details: {}
        "500":
          $ref: "#/components/responses/InternalError"

  /public/vehicles/{id}/images:
    get:
