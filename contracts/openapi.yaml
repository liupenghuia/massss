    PriceValue:
      description: |
        可写入的价格。人民币元，最多 2 位小数，必须 > 0，不设上限。
        type=amount 时 amount 为数字；type=negotiable（面谈）时 amount 必须为 null。
        不允许 type=unset（unset 只出现在历史记录的 from）。
        不规定前台「面议」文案。
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, amount]
          properties:
            type:
              type: string
              const: amount
            amount:
              type: number
              exclusiveMinimum: 0
              multipleOf: 0.01
              description: 人民币元
        - type: object
          additionalProperties: false
          required: [type, amount]
          properties:
            type:
              type: string
              const: negotiable
              description: 面谈
            amount:
              type: "null"

    PriceFrom:
      description: 记录的变动前值。首次设价为 { type: unset }（显式未填写，不是 0、不是空字符串）。
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, amount]
          properties:
            type:
              type: string
              const: amount
            amount:
              type: number
              exclusiveMinimum: 0
              multipleOf: 0.01
        - type: object
          additionalProperties: false
          required: [type, amount]
          properties:
            type:
              type: string
              const: negotiable
            amount:
              type: "null"
        - type: object
          additionalProperties: false
          required: [type]
          properties:
            type:
              type: string
              const: unset
              description: 显式未填写
            amount:
              type: "null"

    AdminPriceView:
      type: object
      additionalProperties: false
      required: [filled, current]
      properties:
        filled:
          type: boolean
          description: 该车是否至少有一条价格记录
        current:
          description: 最新记录的 to。filled=false 时必须为 null。
          oneOf:
            - $ref: "#/components/schemas/PriceValue"
            - type: "null"

    PublicPriceView:
      type: object
      additionalProperties: false
      description: 与管理端视图相同的结构，但不含操作人。只有类型 + 金额。
      required: [filled, current]
      properties:
        filled:
          type: boolean
        current:
          oneOf:
            - $ref: "#/components/schemas/PriceValue"
            - type: "null"

    AdminPutPriceResponse:
      type: object
      additionalProperties: false
      required: [unchanged, filled, current]
      properties:
        unchanged:
          type: boolean
          description: true 表示与当前价完全相同，未插入新行
        filled:
          type: boolean
          description: 成功后恒为 true（不允许清空）
        current:
          $ref: "#/components/schemas/PriceValue"

    AdminPriceRecord:
      type: object
      additionalProperties: false
      required: [id, vehicleId, from, to, createdAt, operatorId]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        vehicleId:
          type: integer
          format: int64
          minimum: 1
        from:
          $ref: "#/components/schemas/PriceFrom"
          description: 变动前
        to:
          $ref: "#/components/schemas/PriceValue"
          description: 变动后。当前价取最新一条的 to。
        createdAt:
          type: string
          format: date-time
        operatorId:
          type: string
          minLength: 1
          description: 登录账号标识。具体形态由 F-006 定稿；本期为已登录管理员的不透明标识。公开响应不得出现本字段。

    PublicPriceRecord:
      type: object
      additionalProperties: false
      description: 公开价格记录。无 operatorId。价格只含类型 + 金额。
      required: [id, from, to, createdAt]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        from:
          $ref: "#/components/schemas/PriceFrom"
        to:
          $ref: "#/components/schemas/PriceValue"
        createdAt:
          type: string
          format: date-time

    AdminPriceRecordList:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminPriceRecord"
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0

    PublicPriceRecordList:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PublicPriceRecord"
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0

