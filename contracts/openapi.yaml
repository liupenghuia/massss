    ImageContentType:
      type: string
      description: 图片 MIME。jpg 对应 image/jpeg。
      enum: [image/jpeg, image/png, image/webp]

    ReportContentType:
      type: string
      description: 评估报告 MIME。
      enum: [application/pdf, image/png, image/jpeg]

    ImagePresignRequest:
      type: object
      additionalProperties: false
      required: [contentType, byteSize]
      properties:
        contentType:
          $ref: "#/components/schemas/ImageContentType"
        byteSize:
          type: integer
          format: int64
          exclusiveMinimum: 0
          maximum: 10485760
          description: 声明的文件字节数。必须 > 0 且 ≤ 10485760。

    ReportPresignRequest:
      type: object
      additionalProperties: false
      required: [contentType, byteSize]
      properties:
        contentType:
          $ref: "#/components/schemas/ReportContentType"
        byteSize:
          type: integer
          format: int64
          exclusiveMinimum: 0
          maximum: 20971520
          description: 声明的文件字节数。必须 > 0 且 ≤ 20971520。

    PresignResponse:
      type: object
      additionalProperties: false
      required: [uploadUrl, objectKey, expiresAt, requiredHeaders]
      properties:
        uploadUrl:
          type: string
          format: uri
          description: 预签名上传 URL。客户端直传对象存储，不经过本服务。
        objectKey:
          type: string
          minLength: 1
          description: 确认落库时原样回传。
        expiresAt:
          type: string
          format: date-time
          description: 预签名过期时间。
        requiredHeaders:
          type: object
          additionalProperties:
            type: string
          description: 直传到 uploadUrl 时必须原样带上的请求头（通常含 Content-Type）。

    ConfirmImageRequest:
      type: object
      additionalProperties: false
      required: [objectKey]
      properties:
        objectKey:
          type: string
          minLength: 1
        caption:
          type: string
          description: 图片说明。省略视为空字符串。

    ConfirmReportRequest:
      type: object
      additionalProperties: false
      required: [objectKey]
      properties:
        objectKey:
          type: string
          minLength: 1

    PatchImageCaptionRequest:
      type: object
      additionalProperties: false
      required: [caption]
      properties:
        caption:
          type: string
          description: 图片说明，允许空字符串。

    ReorderImagesRequest:
      type: object
      additionalProperties: false
      required: [imageIds]
      properties:
        imageIds:
          type: array
          items:
            type: integer
            format: int64
            minimum: 1
          description: 必须是该车当前全部图片 id 的一个排列。

    AdminVehicleImage:
      type: object
      additionalProperties: false
      required: [id, vehicleId, objectKey, url, caption, contentType, byteSize, createdAt]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        vehicleId:
          type: integer
          format: int64
          minimum: 1
        objectKey:
          type: string
        url:
          type: string
          format: uri
          description: 公开直链。车辆下架后本链接不失效，但 /public/* 不再返回该资源。
        caption:
          type: string
          description: 1:1 图片说明，允许空字符串。
        contentType:
          $ref: "#/components/schemas/ImageContentType"
        byteSize:
          type: integer
          format: int64
          exclusiveMinimum: 0
        createdAt:
          type: string
          format: date-time
          description: 确认落库时间。

    PublicVehicleImage:
      type: object
      additionalProperties: false
      description: 公开图片。不含 objectKey。
      required: [id, url, caption, contentType, byteSize, createdAt]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        url:
          type: string
          format: uri
        caption:
          type: string
        contentType:
          $ref: "#/components/schemas/ImageContentType"
        byteSize:
          type: integer
          format: int64
          exclusiveMinimum: 0
        createdAt:
          type: string
          format: date-time

    AdminVehicleImageList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminVehicleImage"
          description: 按当前排序

    PublicVehicleImageList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PublicVehicleImage"

    AdminVehicleReport:
      type: object
      additionalProperties: false
      required: [id, vehicleId, objectKey, url, contentType, byteSize, uploadedAt]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        vehicleId:
          type: integer
          format: int64
          minimum: 1
        objectKey:
          type: string
        url:
          type: string
          format: uri
          description: 原文件公开直链，前台新标签页打开。下架不失效。
        contentType:
          $ref: "#/components/schemas/ReportContentType"
        byteSize:
          type: integer
          format: int64
          exclusiveMinimum: 0
        uploadedAt:
          type: string
          format: date-time
          description: 确认落库时间。列表按此倒序。

    PublicVehicleReport:
      type: object
      additionalProperties: false
      description: 公开评估报告。不含 objectKey。
      required: [id, url, contentType, byteSize, uploadedAt]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        url:
          type: string
          format: uri
        contentType:
          $ref: "#/components/schemas/ReportContentType"
        byteSize:
          type: integer
          format: int64
          exclusiveMinimum: 0
        uploadedAt:
          type: string
          format: date-time

    AdminVehicleReportList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminVehicleReport"
          description: 按 uploadedAt 倒序

    PublicVehicleReportList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PublicVehicleReport"

    PriceValue:
      description: |
        可写入的价格。人民币元，最多 2 位小数，必须 > 0，不设上限。
        type=amount 时 amount 为数字；type=negotiable（面谈）时 amount 必须为 null。
        不允许 type=unset（unset 只出现在历史记录的 from）。
        不规定前台「面议」文案。
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, amount]
          properties:
            type:
              type: string
              const: amount
            amount:
              type: number
              exclusiveMinimum: 0
              multipleOf: 0.01
              description: 人民币元
        - type: object
          additionalProperties: false
          required: [type, amount]
          properties:
            type:
              type: string
              const: negotiable
              description: 面谈
            amount:
              type: "null"

    PriceFrom:
      description: "记录的变动前值。首次设价为 { type: unset }（显式未填写，不是 0、不是空字符串）。"
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, amount]
          properties:
            type:
              type: string
              const: amount
            amount:
              type: number
              exclusiveMinimum: 0
              multipleOf: 0.01
        - type: object
          additionalProperties: false
          required: [type, amount]
          properties:
            type:
              type: string
              const: negotiable
            amount:
              type: "null"
        - type: object
          additionalProperties: false
          required: [type]
          properties:
            type:
              type: string
              const: unset
              description: 显式未填写
            amount:
              type: "null"

    AdminPriceView:
      type: object
      additionalProperties: false
      required: [filled, current]
      properties:
        filled:
          type: boolean
          description: 该车是否至少有一条价格记录
        current:
          description: 最新记录的 to。filled=false 时必须为 null。
          oneOf:
            - $ref: "#/components/schemas/PriceValue"
            - type: "null"

    PublicPriceView:
      type: object
      additionalProperties: false
      description: 与管理端视图相同的结构，但不含操作人。只有类型 + 金额。
      required: [filled, current]
      properties:
        filled:
          type: boolean
        current:
          oneOf:
            - $ref: "#/components/schemas/PriceValue"
            - type: "null"

    AdminPutPriceResponse:
      type: object
      additionalProperties: false
      required: [unchanged, filled, current]
      properties:
        unchanged:
          type: boolean
          description: true 表示与当前价完全相同，未插入新行
        filled:
          type: boolean
          description: 成功后恒为 true（不允许清空）
        current:
          $ref: "#/components/schemas/PriceValue"

    AdminPriceRecord:
      type: object
      additionalProperties: false
      required: [id, vehicleId, from, to, createdAt, operatorId]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        vehicleId:
          type: integer
          format: int64
          minimum: 1
        from:
          $ref: "#/components/schemas/PriceFrom"
          description: 变动前
        to:
          $ref: "#/components/schemas/PriceValue"
          description: 变动后。当前价取最新一条的 to。
        createdAt:
          type: string
          format: date-time
        operatorId:
          type: string
          minLength: 1
          description: 登录账号标识。具体形态由 F-006 定稿；本期为已登录管理员的不透明标识。公开响应不得出现本字段。

    PublicPriceRecord:
      type: object
      additionalProperties: false
      description: 公开价格记录。无 operatorId。价格只含类型 + 金额。
      required: [id, from, to, createdAt]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        from:
          $ref: "#/components/schemas/PriceFrom"
        to:
          $ref: "#/components/schemas/PriceValue"
        createdAt:
          type: string
          format: date-time

    AdminPriceRecordList:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminPriceRecord"
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0

    PublicPriceRecordList:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PublicPriceRecord"
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0

    AdminSessionInfo:
      type: object
      additionalProperties: false
      required: [accountId, loginName, role, mustChangePassword]
      properties:
        accountId: { type: integer, format: int64, minimum: 1 }
        loginName: { type: string }
        role: { type: string, enum: [admin, super_admin] }
        mustChangePassword:
          type: boolean
          description: true 时前端必须强制跳转改密页面，此前调用其他接口返回 403

    AdminAccount:
      type: object
      additionalProperties: false
      description: 账号资源。不含密码/密码哈希。
      required: [id, loginName, role, enabled, mustChangePassword, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        loginName: { type: string }
        role: { type: string, enum: [admin, super_admin] }
        enabled: { type: boolean }
        mustChangePassword: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AdminAccountList:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AdminAccount' } }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }

    AdminAccountCreatedResponse:
      type: object
      additionalProperties: false
      description: 新建账号或重置密码后的一次性响应，initialPassword 只在本次返回，不再可查。
      required: [account, initialPassword]
      properties:
        account: { $ref: '#/components/schemas/AdminAccount' }
        initialPassword:
          type: string
          description: 一次性明文初始口令，仅本次响应体携带，服务端不落库明文

