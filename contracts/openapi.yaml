          description: 过户次数（手数）。草稿阶段未填写时为 null（ADR-035）。
        displacementL:
          type: [number, "null"]
          exclusiveMinimum: 0
          description: 排量（升）。不适用时为 null。
        energyConsumption:
          type: [number, "null"]
          exclusiveMinimum: 0
          description: 电耗。不适用时为 null。
        batteryKwh:
