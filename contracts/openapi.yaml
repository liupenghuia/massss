  /public/vehicles/{id}/reports:
    get:
      tags: [public-media]
      operationId: publicListVehicleReports
      summary: 公开评估报告
      description: |
        仅 published。车不可见 → 404 VEHICLE_NOT_FOUND。
        按 uploadedAt 倒序。url 为原文件公开直链，前台以新标签页打开（ADR-010）。
        不返回 objectKey。
      security: []
      parameters:
        - $ref: "#/components/parameters/VehicleId"
      responses:
        "200":
          description: 报告列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicVehicleReportList"
        "404":
          $ref: "#/components/responses/VehicleNotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/vehicles/{id}/price:
    put:
      tags: [admin-prices]
      operationId: adminPutVehiclePrice
      summary: 设置或调整当前价格
      description: |
        body 为 PriceValue。写路径只 INSERT 新记录；不提供修改或删除已有记录的接口，不允许清空回未填写。
        与当前价完全相同（type + amount）：200，unchanged=true，不插行。
        首次设价：from.type=unset，to 为本次 PriceValue。
        面谈与数值互切算变动。
        无备注字段。无二次确认参数。无批量改价。
        F-005：车辆在回收站中（trashedAt 不为空）时一律拒绝，返回 409 VEHICLE_IN_RECYCLE_BIN。
      security:
        - adminAuth: []
      parameters:
        - $ref: "#/components/parameters/VehicleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PriceValue"
            examples:
              amount:
                value:
                  type: amount
                  amount: 128000.00
              negotiable:
                value:
                  type: negotiable
                  amount: null
      responses:
        "200":
          description: 已处理（可能未插行）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPutPriceResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/VehicleNotFound"
        "409":
          description: 车辆在回收站中（VEHICLE_IN_RECYCLE_BIN，F-005）
          content:
            application/json:
              schema:
                $ref: "./errors.yaml#/components/schemas/ErrorResponse"
              example:
                code: VEHICLE_IN_RECYCLE_BIN
                message: 该车辆在回收站中，无法编辑
                details: {}
        "500":
          $ref: "#/components/responses/InternalError"

    get:
      tags: [admin-prices]
      operationId: adminGetVehiclePrice
      summary: 管理端当前价格
      description: |
        当前价 = 最新一条记录的 to。
        从未设过：200，`{ "filled": false, "current": null }`（不使用 404 PRICE_NOT_SET）。
        供验收/联调的单车只读查询。面谈算已填写。
      security:
        - adminAuth: []
      parameters:
        - $ref: "#/components/parameters/VehicleId"
      responses:
        "200":
          description: 当前价格视图
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPriceView"
              examples:
                unfilled:
                  value:
                    filled: false
                    current: null
                filledAmount:
                  value:
                    filled: true
                    current:
                      type: amount
                      amount: 128000.00
                filledNegotiable:
                  value:
                    filled: true
                    current:
                      type: negotiable
                      amount: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/VehicleNotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/vehicles/{id}/price-records:
    get:
      tags: [admin-prices]
      operationId: adminListVehiclePriceRecords
      summary: 管理端单车价格记录
      description: |
        该车历史，按 createdAt 倒序，其次 id 倒序。可分页。
        含 operatorId。无记录时 200，items 为空数组（不是 404）。
        不做独立历史页所需的跨车筛选，不做导出。
      security:
        - adminAuth: []
      parameters:
        - $ref: "#/components/parameters/VehicleId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 价格记录分页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPriceRecordList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/VehicleNotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /public/vehicles/{id}/price:
    get:
      tags: [public-prices]
      operationId: publicGetVehiclePrice
      summary: 公开当前价格
      description: |
        仅 published。车不可见 → 404 VEHICLE_NOT_FOUND。
        只返回 filled + current（type + amount）。无 operatorId。不规定「面议」文案。
      security: []
      parameters:
        - $ref: "#/components/parameters/VehicleId"
      responses:
        "200":
          description: 当前价格（类型 + 金额）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicPriceView"
        "404":
          $ref: "#/components/responses/VehicleNotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /public/vehicles/{id}/price-records:
    get:
      tags: [public-prices]
      operationId: publicListVehiclePriceRecords
      summary: 公开价格记录
      description: |
        仅 published。车不可见 → 404 VEHICLE_NOT_FOUND。
        每条只含价格类型 + 金额（from / to）及 id、createdAt；无 operatorId。
        预留分页参数。默认条数与前台展示策略由 F-002 定，本接口不规定「最近 20 条」。
        时间倒序。
      security: []
      parameters:
        - $ref: "#/components/parameters/VehicleId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 公开价格记录分页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicPriceRecordList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/VehicleNotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/auth/login:
    post:
      operationId: adminLogin
      summary: 登录
      description: |
        匿名可访问（唯一不需要 adminAuth 的 /admin/* 接口）。
        登录名+密码，恒定时间比较。连续 5 次失败（固定窗口，DB 原子计数）锁定该账号 15 分钟，
        锁定期内即使密码正确也拒绝，返回 403 ACCOUNT_LOCKED；成功登录后计数器清零。
        加基础 IP 级速率限制，防止跨账号撞库枚举。
        账号不存在或密码错误：403 INVALID_CREDENTIALS，两种情况返回完全相同的响应体，
        不给出任何可区分账号是否存在的信息。
        账号 disabled 时，即使密码正确也拒绝登录：403 ACCOUNT_DISABLED（与密码错误可区分，
        因为调用方已经知道自己在用哪个 loginName 登录，不构成新的枚举面）。
        成功后 Set-Cookie 下发会话（8 小时滑动过期，HttpOnly/Secure/SameSite=Strict，见
        securityScheme 定义）。
        mustChangePassword=true（首次登录或密码被重置后）时，登录仍然成功，响应体标注该字段，
        前端必须强制跳转改密页；改密前调用除 `/admin/auth/password`、`/admin/auth/logout` 外的
        任何 /admin/* 接口返回 403 MUST_CHANGE_PASSWORD。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [loginName, password]
              properties:
                loginName: { type: string, minLength: 1 }
                password: { type: string, minLength: 1 }
      responses:
        "200":
          description: 登录成功
          headers:
            Set-Cookie:
              description: HttpOnly; Secure; SameSite=Strict; Path=/admin 会话 cookie
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSessionInfo' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "403":
          description: 密码错误或账号不存在（INVALID_CREDENTIALS）/ 账号已停用（ACCOUNT_DISABLED）/ 账号被锁定（ACCOUNT_LOCKED）
          content: { application/json: { schema: { $ref: './errors.yaml#/components/schemas/ErrorResponse' } } }
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500": { $ref: '#/components/responses/InternalError' }

  /admin/auth/logout:
    post:
      operationId: adminLogout
      summary: 登出
      description: 作废当前会话（仅当前这一个，不影响该账号其他设备的会话）。
      security: [{ adminAuth: [] }]
      responses:
        "200": { description: 已登出 }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "500": { $ref: '#/components/responses/InternalError' }

  /admin/auth/password:
    post:
      operationId: adminChangeOwnPassword
      summary: 修改自己的密码
      description: |
        需提供当前密码。新密码最少 8 位，需同时含字母与数字。
        成功后作废该账号全部现有会话（含当前这次请求的会话），响应体不再提示重新登录信息，
        客户端需引导用户用新密码重新登录。mustChangePassword 置为 false。
      security: [{ adminAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, minLength: 1 }
                newPassword: { type: string, minLength: 8 }
      responses:
        "200": { description: 修改成功，全部会话已作废 }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { description: 当前密码错误（INVALID_CREDENTIALS）, content: { application/json: { schema: { $ref: './errors.yaml#/components/schemas/ErrorResponse' } } } }
        "500": { $ref: '#/components/responses/InternalError' }

  /admin/accounts:
    post:
      operationId: adminCreateAccount
      summary: 新建管理员账号（仅超管）
      description: |
        仅 super_admin 可调用。填 loginName + role，系统生成随机初始口令，仅在本次响应体里
        明文返回一次（不落库明文、不可再查看）。新账号 mustChangePassword=true。
        loginName 全局唯一，创建后不可修改；已停用账号的 loginName 永久占用不可复用。

        **不提供 Idempotency-Key**：与 F-001 建车辆不同，若网络超时导致客户端未收到这次响应，
        账号在服务端已创建成功但客户端拿不到那个一次性口令——这种情况**接受**（ADR-026 已裁决
        流程），恢复路径是超管再调用一次 `POST /admin/accounts/{accountId}/password-reset`
        重新生成一个新口令，不做"重放返回同一口令"的幂等设计（会破坏"口令不落库明文、不可再查"
        的安全承诺）。
        **网关/日志系统要求**：本接口响应体含明文口令，网关、APM、错误监控、反向代理日志
        **禁止记录本接口与 password-reset 接口的响应体**，仅记录状态码与耗时。
      security: [{ adminAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [loginName, role]
              properties:
                loginName: { type: string, minLength: 1, maxLength: 50 }
                role: { type: string, enum: [admin, super_admin] }
      responses:
        "201":
          description: 创建成功，含一次性明文初始口令
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAccountCreatedResponse' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { description: 非超管调用（FORBIDDEN）, content: { application/json: { schema: { $ref: './errors.yaml#/components/schemas/ErrorResponse' } } } }
        "409": { description: loginName 已被占用（含已停用账号）, content: { application/json: { schema: { $ref: './errors.yaml#/components/schemas/ErrorResponse' } } } }
        "500": { $ref: '#/components/responses/InternalError' }

    get:
      operationId: adminListAccounts
      summary: 账号列表（仅超管）
      description: |
        默认展示全部账号（含已停用），带角色与启用状态标签。仅 super_admin 可调用。
        默认排序：id 升序（创建顺序）。
      security: [{ adminAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        "200": { description: 账号列表, content: { application/json: { schema: { $ref: '#/components/schemas/AdminAccountList' } } } }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { description: 非超管调用（FORBIDDEN）, content: { application/json: { schema: { $ref: './errors.yaml#/components/schemas/ErrorResponse' } } } }
        "500": { $ref: '#/components/responses/InternalError' }

  /admin/accounts/{accountId}/status:
    post:
      operationId: adminSetAccountStatus
      summary: 停用 / 启用账号（仅超管）
      description: |
        body.enabled=false 为停用，true 为启用。仅 super_admin 可调用。
        用单一端点 + 布尔值而非 F-001 式的独立动词端点（publish/unpublish），是因为启用/停用只有
        两态、无中间态、无前置校验，用布尔值更省；F-001 的多态转换更适合动词端点，两种风格在本
        仓库内并存是刻意选择，不是遗漏。

        检查顺序（先后如下，前面命中即短路）：
        1. 非 super_admin 调用 → 403 FORBIDDEN
        2. 目标账号不存在 → 404
        3. 目标账号是调用者自己 → 403 CANNOT_DISABLE_SELF（无论 enabled 传 true 还是 false，
           只要目标是自己就拒绝，简化规则，不必区分"停用自己"与"启用自己"这种理论上无意义的组合）
        4. 已是目标状态（enabled 与当前一致）→ 200 幂等成功，不再往下检查
        5. enabled=false 且目标是系统里最后一个启用状态的 super_admin → 409 LAST_SUPER_ADMIN
        6. 以上均不命中 → 执行变更，停用时作废该账号全部现有会话（同步一致失效，见 securityScheme）
      security: [{ adminAuth: [] }]
      parameters:
        - name: accountId
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "200": { description: 已生效（含幂等重复调用）, content: { application/json: { schema: { $ref: '#/components/schemas/AdminAccount' } } } }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { description: 非超管调用（FORBIDDEN），或对自己调用（CANNOT_DISABLE_SELF）, content: { application/json: { schema: { $ref: './errors.yaml#/components/schemas/ErrorResponse' } } } }
        "404": { description: 账号不存在, content: { application/json: { schema: { $ref: './errors.yaml#/components/schemas/ErrorResponse' } } } }
        "409": { description: 尝试停用最后一个启用超管, content: { application/json: { schema: { $ref: './errors.yaml#/components/schemas/ErrorResponse' } } } }
        "500": { $ref: '#/components/responses/InternalError' }

    delete:
      operationId: adminDeleteAccount
      summary: 删除账号（软删除，仅超管，ADR-119）
      description: |
        仅 super_admin 可调用。软删除：账号打 deleted_at 标记，不物理清除行，不可恢复。

        前置条件：目标账号必须是"已停用"（disabled）状态，否则 409。
        "不能删除自己"不作为独立校验规则：ADR-026 已禁止"停用自己"，而删除的前置条件是
        "已停用"，两条规则组合后超管天然无法把自己降到可删状态，属于隐含防御。

        删除后该账号的 loginName 永久占用不释放，不可被新账号复用，与账号创建/停用接口
        既有的 loginName 永久占用规则一致。

        重复调用同一个已删除账号返回 404（不是幂等成功）——删除是不可逆操作，需要明确反馈。

        **实现提示**：服务端判断前置条件时应使用数据库层条件更新（如
        `UPDATE ... WHERE id=? AND status='disabled' AND deleted_at IS NULL` 判断受影响行数），
        而非先查询状态再更新的两步式判断，避免并发场景下的竞态。
      security: [{ adminAuth: [] }]
      parameters:
        - name: accountId
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        "204": { description: 删除成功，无响应体 }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { description: 非超管调用（FORBIDDEN）, content: { application/json: { schema: { $ref: './errors.yaml#/components/schemas/ErrorResponse' } } } }
        "404": { description: 账号不存在，或已被软删除, content: { application/json: { schema: { $ref: './errors.yaml#/components/schemas/ErrorResponse' } } } }
        "409": { description: 账号当前不是已停用状态, content: { application/json: { schema: { $ref: './errors.yaml#/components/schemas/ErrorResponse' } } } }
        "500": { $ref: '#/components/responses/InternalError' }

  /admin/accounts/{accountId}/role:
    post:
      operationId: adminSetAccountRole
      summary: 修改账号角色（仅超管，ADR-026 允许升降级）
      description: |
        仅 super_admin 可调用。

        检查顺序（先后如下，前面命中即短路）：
        1. 非 super_admin 调用 → 403 FORBIDDEN
        2. 目标账号不存在 → 404
        3. 已是目标角色 → 200 幂等成功，不再往下检查
        4. role=admin（降级）且目标是系统里最后一个启用状态的 super_admin → 409 LAST_SUPER_ADMIN
        5. 以上均不命中 → 执行变更（不影响会话，角色变更不强制下线，下一次鉴权即按新角色生效）
      security: [{ adminAuth: [] }]
      parameters:
        - name: accountId
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role]
              properties:
                role: { type: string, enum: [admin, super_admin] }
      responses:
        "200": { description: 已生效（含幂等重复调用）, content: { application/json: { schema: { $ref: '#/components/schemas/AdminAccount' } } } }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { description: 非超管调用（FORBIDDEN）, content: { application/json: { schema: { $ref: './errors.yaml#/components/schemas/ErrorResponse' } } } }
        "404": { description: 账号不存在, content: { application/json: { schema: { $ref: './errors.yaml#/components/schemas/ErrorResponse' } } } }
        "409": { description: 尝试降级最后一个启用超管, content: { application/json: { schema: { $ref: './errors.yaml#/components/schemas/ErrorResponse' } } } }
        "500": { $ref: '#/components/responses/InternalError' }

  /admin/accounts/{accountId}/password-reset:
    post:
      operationId: adminResetAccountPassword
      summary: 重置他人密码（仅超管）
      description: |
        仅 super_admin 可调用。生成新随机口令，仅在本次响应体里明文返回一次。
        重置后该账号 mustChangePassword 置为 true，且全部现有会话作废。
        同样不提供 Idempotency-Key，网络超时未收到口令时可重复调用本接口生成新口令
        （本接口天然可重复调用，语义上比建号更安全）。
        网关/日志系统同样禁止记录本接口响应体（见 adminCreateAccount 的日志脱敏要求）。
      security: [{ adminAuth: [] }]
      parameters:
        - name: accountId
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        "200": { description: 重置成功，含一次性明文新口令, content: { application/json: { schema: { $ref: '#/components/schemas/AdminAccountCreatedResponse' } } } }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { description: 非超管调用（FORBIDDEN）, content: { application/json: { schema: { $ref: './errors.yaml#/components/schemas/ErrorResponse' } } } }
        "404": { description: 账号不存在, content: { application/json: { schema: { $ref: './errors.yaml#/components/schemas/ErrorResponse' } } } }
        "500": { $ref: '#/components/responses/InternalError' }

components:
  securitySchemes:
    adminAuth:
      type: apiKey
      in: cookie
      name: admin_session
      description: |
        服务端会话（ADR-027），不透明会话标识，客户端不解析。8 小时滑动过期，同账号允许多端登录。
        账号停用或改密后，该账号全部现有会话作废——吊销判定必须**同步一致读**（每次请求查会话
        存储判定是否已被吊销），不允许"内存缓存+定期刷新"引入延迟窗口，否则违反 ADR-027 的
        「停用立即生效」零容忍要求。

        Cookie 属性（安全定稿，reviewer-security 阻塞项）：`HttpOnly; Secure; SameSite=Strict;
        Path=/admin`。管理后台前端与本 API 同源部署（同域名，不同于 ADR-028 里"前台与后台
        不同域"——那是前台公开站点与后台的隔离，后台前端与后台 API 视为同一部署单元），
        因此不需要跨域 CORS credentials 配置，`SameSite=Strict` 天然覆盖大部分 CSRF 场景。

        CSRF 防护（安全定稿）：除 `SameSite=Strict` 外，全部状态变更接口（POST/PUT/DELETE）
        额外校验请求的 `Origin` header 必须等于部署域名，不一致则 403 FORBIDDEN，双重防护。

        密码存储：服务端用 **argon2id**（或 bcrypt，cost factor ≥ 12）存储密码哈希，
        **禁止**明文或 MD5/SHA256 直接摘要落库。全部 `/admin/*` 接口强制 HTTPS 传输，
        不接受明文 HTTP。密码比对使用哈希库自带的恒定时间比较，避免时序侧信道。

        未携带有效会话 → 401 UNAUTHORIZED。
        已登录但角色不足（如管理员访问超管专属接口）→ 403 FORBIDDEN。
        已登录但账号已被停用（会话吊销前的极短竞态窗口内）→ 401 UNAUTHORIZED（视为会话已失效，
        不使用 403，避免与"角色不足"混淆）。
        已登录但 mustChangePassword=true 且调用的不是改密接口本身 → 403 MUST_CHANGE_PASSWORD。

  headers:
    ETag:
      description: 当前车辆 version 的带引号十进制字符串，例如 `"12"`。PATCH 时可原样放入 If-Match。
      schema:
        type: string

  parameters:
    VehicleId:
      name: id
      in: path
      required: true
      description: 车辆技术主键（系统生成 int64）
      schema:
        type: integer
        format: int64
        minimum: 1
    ImageId:
      name: imageId
      in: path
      required: true
      description: 图片 id
      schema:
        type: integer
        format: int64
        minimum: 1
    ReportId:
      name: reportId
      in: path
      required: true
      description: 评估报告 id
      schema:
        type: integer
        format: int64
        minimum: 1
    Page:
      name: page
      in: query
      required: false
      description: 页码，从 1 开始。超出实际页数时返回空 items，total 仍为匹配总数。
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      description: 每页条数。工程上限 100，不是车辆规模上限（ADR-007）。
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        创建车辆幂等键。同一 Key 重放返回同一车辆。
        仅 2xx 成功响应对该 Key 生效。
        同一 Key 搭配不同请求体 → 409 IDEMPOTENCY_KEY_CONFLICT。
      schema:
        type: string
        minLength: 1
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: |
        乐观锁版本。与 GET 返回的 ETag 相同格式（带引号），也接受不带引号的 version 十进制，如 `12`。
        与 body.version 二选一必填；同时提供时必须表示同一值，否则 400 VALIDATION_ERROR。
        不支持 `*`。
      schema:
        type: string

  responses:
    BadRequest:
      description: 请求不合法（VALIDATION_ERROR / MISSING_VERSION / IDEMPOTENCY_KEY_REQUIRED / INVALID_OBJECT_KEY / INVALID_CONTENT_TYPE / FILE_TOO_LARGE / IMAGE_ORDER_MISMATCH / OBJECT_NOT_UPLOADED）
      content:
        application/json:
          schema:
            $ref: "./errors.yaml#/components/schemas/ErrorResponse"
    Unauthorized:
      description: 未登录或登录已失效
      content:
        application/json:
          schema:
            $ref: "./errors.yaml#/components/schemas/ErrorResponse"
          example:
            code: UNAUTHORIZED
            message: 未登录或登录已失效
            details: {}
    Forbidden:
      description: 已登录但角色不足 / 需要先改密 / 账号已停用 / 账号被锁定，具体场景见响应体 code 字段
      content:
        application/json:
          schema:
            $ref: "./errors.yaml#/components/schemas/ErrorResponse"
    VehicleNotFound:
      description: 车辆不存在；公开端亦覆盖非 published
      content:
        application/json:
          schema:
            $ref: "./errors.yaml#/components/schemas/ErrorResponse"
          example:
            code: VEHICLE_NOT_FOUND
            message: 车辆不存在
            details: {}
    Conflict:
      description: 冲突（VEHICLE_VERSION_CONFLICT / IDEMPOTENCY_KEY_CONFLICT / ILLEGAL_STATUS_TRANSITION / PUBLISHED_IMAGE_MIN / VEHICLE_VIN_DUPLICATE）
      content:
        application/json:
          schema:
            $ref: "./errors.yaml#/components/schemas/ErrorResponse"
    InternalError:
      description: 服务内部错误。发布反查失败不得降级为前置条件失败。
      content:
        application/json:
          schema:
            $ref: "./errors.yaml#/components/schemas/ErrorResponse"
          example:
            code: INTERNAL_ERROR
            message: 服务内部错误
            details: {}
    TooManyRequests:
      description: |
        IP 级限流触发，窗口与阈值随接口而定（见对应接口 description）：
        公开只读接口（GET /public/*）窗口 60 秒、阈值 1000 次/IP；
        POST /admin/auth/login 另有独立的 IP 级限流（F-006，ADR-103），
        与账号级锁定（ACCOUNT_LOCKED）是两层独立防线，IP 限流检查在前。
      content:
        application/json:
          schema:
            $ref: "./errors.yaml#/components/schemas/ErrorResponse"
          example:
            code: TOO_MANY_REQUESTS
            message: 请求过于频繁，请稍后再试
            details: {}

  schemas:
    VehicleStatus:
      type: string
      description: 车辆状态。draft 草稿 / published 已上架 / unpublished 已下架。不支持已下架退回草稿。
      enum: [draft, published, unpublished]

    EnergyType:
      type: string
      description: |
        能源类型。
        gasoline=汽油，ev=纯电，phev=插电混动，range_extender=增程式。
        选填联动：
        - displacementL 适用于 gasoline / phev / range_extender
        - energyConsumption、batteryKwh 适用于 ev / phev / range_extender
      enum: [gasoline, ev, phev, range_extender]

    AdminVehicle:
      type: object
      additionalProperties: false
      description: |
        管理端车辆资源。含 vinMasked，不含 vin 明文，不含价格。
        vinMasked 规则：vin 为 null 则本字段为 null；否则保留末最多 6 位明文，其余为 `*`。
      required:
        - id
        - status
        - version
        - displacementL
        - energyConsumption
        - batteryKwh
        - vinMasked
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          description: 系统生成的技术主键，跨 feature 关联锚点
        status:
          $ref: "#/components/schemas/VehicleStatus"
        trashedAt:
          type: [string, "null"]
          format: date-time
          description: |
            F-005。删除进回收站的时间；null 表示不在回收站（正常在管）。
            管理后台据此判断车辆当前是否可编辑，无需额外请求。
        purged:
          type: boolean
          description: |
            F-005。是否已被到期清除任务彻底清除。true 时该车仅剩只读展示用途（见
            GET /admin/recycle-bin/{id}），本接口不因 purged=true 而 404。
        version:
          type: integer
          format: int64
          minimum: 1
          description: 乐观锁版本。创建时为 1。实际修改后递增。
        brand:
          type: [string, "null"]
          minLength: 1
          description: 品牌。草稿阶段未填写时为 null（ADR-035）。
        model:
          type: [string, "null"]
          minLength: 1
          description: 车型。草稿阶段未填写时为 null（ADR-035）。
        registrationYear:
          type: [integer, "null"]
          description: 上牌年份（公元纪年）。草稿阶段未填写时为 null（ADR-035）。
        mileageKm:
          type: [integer, "null"]
          minimum: 0
          description: 里程（千米）。草稿阶段未填写时为 null（ADR-035）。
        color:
          type: [string, "null"]
          description: 颜色。草稿阶段未填写时为 null（ADR-035）。
        conditionDesc:
          type: [string, "null"]
          description: 车况描述（整车说明，不是图片说明）。草稿阶段未填写时为 null（ADR-035）。
        energyType:
          oneOf:
            - $ref: "#/components/schemas/EnergyType"
            - type: "null"
          description: 草稿阶段未填写时为 null（ADR-035）。
        transferCount:
          type: [integer, "null"]
          minimum: 0
          description: 过户次数（手数）。草稿阶段未填写时为 null（ADR-035）。
        displacementL:
          type: [number, "null"]
          exclusiveMinimum: 0
          description: 排量（升）。gasoline / phev / range_extender 适用；ev 时为 null。
        energyConsumption:
          type: [number, "null"]
          exclusiveMinimum: 0
          description: 电耗。ev / phev / range_extender 适用；gasoline 时为 null。单位本期不枚举。
        batteryKwh:
          type: [number, "null"]
          exclusiveMinimum: 0
          description: 电池度数（kWh）。ev / phev / range_extender 适用；gasoline 时为 null。
        vinMasked:
          type: [string, "null"]
          description: VIN 脱敏，只露后六位。后台展示用。公开接口不得出现本字段。
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AdminRecycleBinItem:
      type: object
      additionalProperties: false
      description: |
        回收站内车辆的只读视图。不含 status——车辆在回收站期间 status 本身不变（ADR-023 正交建模），
        originalStatus 已完整表达"删除前是什么状态"，重复放一个 status 字段只会引起混淆，故省略。
        不含价格字段，价格走 GET /admin/vehicles/{id}/price-records。
